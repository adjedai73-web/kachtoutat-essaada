<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="قشطوطة السعادة — تحليات مصرية 100% طبيعية. اطلب من فرعك عبر واتساب: الرويبة، مستغانم، بجاية، سيدي عبد الله.">
<meta name="theme-color" content="#14306E">
<title>Kachtoutat Essaâda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: quiet luxury — white paper, one navy, one sky accent, hairlines; Ruqaa calligraphy echoes the logo; arch photo echoes the Cairo skyline on the pots */
:root{
  --paper:#FFFFFF; --mist:#F5F8FC; --line:#E3E9F2; --line-2:#D3DDEA;
  --navy:#14306E; --navy-2:#1E428F; --ink:#0F1C38; --muted:#6B7894;
  --sky:#5DB7EE; --sky-wash:#EAF5FD; --ok:#1F8F5F; --off:#B4495A;
  --f-ar:"El Messiri","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-fr:"Cormorant Garamond","Times New Roman",serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-display:var(--f-ar);
  --r:18px;
  color-scheme:light;
}
body[dir="ltr"]{--f-display:var(--f-fr)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-body);font-weight:600}
.eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sky)}
body[dir="rtl"] .eyebrow{letter-spacing:0;font-size:14px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy);min-width:0}
.brand img{width:42px;height:auto;display:block}
.brand b{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-size:10px;letter-spacing:.22em;color:var(--muted);font-family:var(--f-body)}
.hspace{flex:1}
.branchpill{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--off)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:4px 11px;font-weight:600;font-size:12px}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px}
.cartbtn .badge{background:#fff;color:var(--navy);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;padding:0 5px}
.cartbtn.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.1)}60%{transform:scale(.97)}}

/* hero */
.hero{position:relative;padding-top:56px;background:linear-gradient(180deg,#FFFFFF 0%,#F2F8FE 100%);overflow:hidden}
.hcenter{display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px;position:relative;z-index:1}
.hlogo{width:118px;height:auto;display:block;filter:drop-shadow(0 14px 24px rgba(20,48,110,.18))}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(42px,6.6vw,80px);line-height:1.2;margin:0;color:var(--navy);text-wrap:balance;display:flex;flex-direction:column;align-items:center;gap:2px}
body[dir="ltr"] .hero h1{font-weight:600;line-height:1.04}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#2E7CC0 0%,#5DB7EE 55%,#2E7CC0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding-bottom:6px;position:relative}
.hero h1 em::after{content:"";display:block;width:64px;height:3px;border-radius:3px;background:var(--sky);margin:10px auto 0;opacity:.6}
body[dir="ltr"] .hero h1 em{font-style:italic}
.points{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 28px}
.points li{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;font-weight:500}
.points .pi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);color:var(--navy);background:#fff;flex:none}
.ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:13px 28px;font-weight:600;text-decoration:none;font-size:15px}
.btn-sky,.btn-navy{background:var(--navy);color:#fff}
.btn-sky:hover,.btn-navy:hover{background:var(--navy-2)}
.btn-ghost{background:#fff;color:var(--navy);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--navy)}
.skyline{position:relative;margin-top:30px;height:clamp(130px,16vw,222px)}
.skyline .sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.hband{background:var(--navy);color:rgba(255,255,255,.75);margin-top:-1px}
.facts{display:flex;flex-wrap:wrap;padding-block:22px}
.facts > span{flex:1 1 0;min-width:110px;padding-inline:18px;font-size:12px;line-height:1.4;text-align:center}
.facts > span + span{border-inline-start:1px solid rgba(255,255,255,.18)}
.facts b{display:block;font-family:var(--f-body);font-weight:600;font-size:24px;color:#fff;margin-bottom:4px}

/* sections */
section{padding-block:64px 0}
.sh{margin-bottom:26px;display:grid;gap:6px;max-width:640px}
.sh h2{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,4.4vw,46px);line-height:1.2;margin:0;color:var(--navy)}
body[dir="ltr"] .sh h2{font-weight:600}
.sh p{margin:0;color:var(--muted)}

/* branches */
.branches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bcard{text-align:start;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,box-shadow .2s}
.bcard:hover{border-color:var(--line-2)}
.bcard[data-on="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy),0 18px 40px rgba(20,48,110,.1)}
.btop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.bname{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--navy);line-height:1.15}
body[dir="ltr"] .bname{font-weight:600}
.bsub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap;background:#EAF6F0;color:var(--ok)}
.stat.off{background:#F8ECEE;color:var(--off)}
.stat .dot{width:6px;height:6px;background:currentColor}
.binfo{margin:0;display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.binfo div{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.binfo dt{font-size:12px;color:var(--muted)}
.binfo dd{margin:0;font-size:14px;color:var(--ink);text-align:end}
.binfo dd.ph{direction:ltr;unicode-bidi:isolate;display:grid;gap:2px}
.bact{margin-top:auto;display:grid;grid-template-columns:auto 1fr;gap:8px}
.bmap{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--navy);text-decoration:none;white-space:nowrap}
.bmap:hover{border-color:var(--navy)}
.bsel{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:9px;font-size:13px;font-weight:600;color:var(--navy)}
.bcard[data-on="true"] .bsel{background:var(--navy);border-color:var(--navy);color:#fff}

/* finder */
.finder{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel h3{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em}
.moods{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:7px 15px;font-size:14px;color:var(--ink)}
.chip:hover{border-color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.budget{display:grid;gap:10px}
.budget .val{font-family:var(--f-body);font-weight:600;font-size:34px;color:var(--navy);line-height:1}
.budget .val small{font-size:14px;color:var(--muted);font-weight:400}
input[type=range]{width:100%;accent-color:var(--navy)}
.budget .hint{font-size:13px;color:var(--muted)}

/* menu */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:15;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin-bottom:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:14px 0 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
.tab[aria-pressed="true"]{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.cat{padding-top:34px;scroll-margin-top:140px}
.cat h3{font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--navy);margin:0;display:flex;align-items:center;gap:12px;line-height:1.25}
body[dir="ltr"] .cat h3{font-weight:600}
.cat .cov{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
.cat h3 .n{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.cat > p{margin:2px 0 16px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 14px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;text-align:start;transition:border-color .2s,box-shadow .25s}
.card:hover{border-color:var(--line-2);box-shadow:0 16px 36px rgba(20,48,110,.08)}
.card .pic{position:relative;display:grid;place-items:center;aspect-ratio:1/0.86;border-radius:12px;background:var(--mist);overflow:hidden;border:0;padding:0;width:100%}
.card .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .pic img{transform:scale(1.04)}
.card .pic svg{position:relative;width:56%;transition:transform .4s}
.card .pic.tub svg{width:70%}
.card:hover .pic svg{transform:translateY(-3px)}
.card .pic .real{position:absolute;bottom:8px;inset-inline-start:8px;z-index:1;background:rgba(255,255,255,.94);color:var(--navy);font-size:10px;font-weight:600;border-radius:999px;padding:2px 8px}
.card .tag{position:absolute;top:18px;inset-inline-start:18px;background:var(--navy);color:#fff;font-size:10px;font-weight:600;border-radius:999px;padding:3px 9px;z-index:2;letter-spacing:.04em}
.card .nm{font-weight:500;font-size:15px;line-height:1.45;margin:0;padding-inline:4px}
.card .ar{display:block;font-size:12px;color:var(--muted);font-weight:400}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-inline:4px}
.card .pr{font-size:16px;color:var(--navy)}
.card .pr small{font-size:11px;color:var(--muted);font-weight:400}
.add{width:36px;height:36px;border-radius:50%;border:1px solid var(--navy);background:var(--paper);color:var(--navy);font-size:20px;line-height:1;display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.add:hover{background:var(--navy);color:#fff}
.empty{padding:34px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}

/* gallery */
.gallery{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}
.gallery figure{margin:0;position:relative;border-radius:var(--r);overflow:hidden;background:var(--mist)}
.gallery figure:first-child{grid-row:span 2}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:4/3}
.gallery figure:first-child img{aspect-ratio:auto;min-height:100%}
.gallery figcaption{position:absolute;inset:auto 12px 12px;background:rgba(255,255,255,.95);color:var(--navy);font-size:12px;font-weight:500;border-radius:999px;padding:5px 12px;width:fit-content;max-width:calc(100% - 24px)}
@media (max-width:700px){.gallery{grid-template-columns:1fr 1fr}.gallery figure:first-child{grid-column:span 2;grid-row:auto}.gallery figure:first-child img{aspect-ratio:4/3.4}}

/* socials */
.social{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.soc{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;text-decoration:none;color:var(--ink);transition:border-color .2s,box-shadow .2s;min-width:0}
.soc:hover{border-color:var(--navy);box-shadow:0 14px 30px rgba(20,48,110,.08)}
.soc .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sky-wash);color:var(--navy);flex:none}
.soc b{display:block;font-size:15px;font-weight:600;color:var(--navy)}
.soc small{display:block;font-size:12px;color:var(--muted);direction:ltr;unicode-bidi:isolate;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soc span.t{min-width:0}
.soc .arr{margin-inline-start:auto;color:var(--muted)}
body[dir="rtl"] .soc .arr{transform:scaleX(-1)}

/* info */
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.info .panel{border:0;border-radius:0;padding:26px 22px}
.info .panel + .panel{border-inline-start:1px solid var(--line)}
.info .panel b{display:block;font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--navy);margin-bottom:6px}
.info .panel span{color:var(--muted);font-size:14px}
footer{background:var(--navy);color:rgba(255,255,255,.82);padding-block:34px calc(34px + env(safe-area-inset-bottom,0px));margin-top:72px;font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center}
footer img{width:48px;display:block}
footer .fb{display:flex;align-items:center;gap:12px}
.fsoc{display:flex;gap:8px}
.fsoc a{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;color:#fff}
.fsoc a:hover{background:rgba(255,255,255,.12)}

/* sheet + drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,45,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:24px 24px 0 0;transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:16px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line-2);margin:0 auto 14px}
.sheet .top{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.sheet .stage{background:var(--mist);border-radius:16px;display:grid;place-items:center;aspect-ratio:1;overflow:hidden}
.sheet .stage svg{width:76%}
.sheet .stage img{width:100%;height:100%;object-fit:cover}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;color:var(--navy);line-height:1.25}
.sheet .base{color:var(--muted);font-size:13px}
.lbl{font-weight:600;color:var(--navy);margin:20px 0 10px;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.lbl span{font-weight:400;color:var(--muted);font-size:12px}
.extras{display:flex;flex-wrap:wrap;gap:8px}
.extra{display:inline-flex;align-items:center;gap:8px}
.extra i{width:9px;height:9px;border-radius:50%;display:inline-block}
.qty{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:999px;padding:3px}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--mist);font-size:17px;font-weight:600;color:var(--navy)}
.qty output{min-width:26px;text-align:center}
textarea,input[type=text],input[type=tel],select{width:100%;border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;background:var(--paper)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--navy)}
textarea{resize:vertical;min-height:58px}
.sheetfoot{display:flex;gap:10px;align-items:center;margin-top:20px}
.sheetfoot .btn{flex:1}
.drawer{position:fixed;z-index:50;top:0;bottom:0;inset-inline-start:0;width:min(440px,100%);background:var(--paper);transform:translateX(var(--off-x,105%));transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
body[dir="ltr"] .drawer{--off-x:-105%}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h3{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;color:var(--navy)}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:18px;color:var(--navy)}
.dbody{flex:1;overflow:auto;padding:14px 20px;display:grid;gap:14px;align-content:start}
.line{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.line .mini{background:var(--mist);border-radius:10px;display:grid;place-items:center;aspect-ratio:1;overflow:hidden}
.line .mini svg{width:76%}.line .mini img{width:100%;height:100%;object-fit:cover}
.line .t{min-width:0}
.line .t b{display:block;font-size:14px;font-weight:600}
.line .t small{color:var(--muted);font-size:12px}
.line .qty button{width:26px;height:26px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;border-radius:9px;padding:9px;background:transparent;font-weight:500;color:var(--navy);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.dfoot{border-top:1px solid var(--line);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total b{font-size:24px;color:var(--navy)}
.small{font-size:12px;color:var(--muted)}
.wa{background:var(--navy);color:#fff}
.wa[aria-disabled="true"]{background:#A9B5CC;cursor:not-allowed}
.err{color:var(--off);font-size:13px;min-height:1em}
.copyrow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--navy-2);text-decoration:underline;font-size:12px;padding:4px}
.mbar{display:none}
.flyer{position:fixed;z-index:60;width:60px;border-radius:14px;overflow:hidden;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.4,1),opacity .7s}
.fill{transform-box:fill-box;transform-origin:50% 100%}

@media (max-width:960px){
  .branches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .finder{grid-template-columns:1fr}

const TUB = {"ملوخيتو":["#C9D62C","#FFFFFF","ملوخيتو"],"فتة":["#3AA6E0","#FFFFFF","فتة"],"كيك بوم":["#DCCBE6","#E5408A","cake|boom"],"كشري":["#3B3FB2","#FFFFFF","كشري"],"ارز بلبن":["#D4E7F5","#2B3990","رز بلبن"]};
const FRUITY = ["فواكه","مشكل فواكه","مانجو","كيوي","فراولة"];

const CATS = [], P = [];
(() => {
  const lines = MENU.split("\n");
  for(let i=0;i<lines.length;i+=2){
    const fam = lines[i].trim(), f = FAM[fam], cid = "c"+(i/2);
    CATS.push({id:cid,ar:f[0],fr:f[1],sAr:f[2],sFr:f[3],cov:COVER[fam]?IMG[COVER[fam]]:""});
    lines[i+1].split("|").forEach(it=>{
      const m = it.trim().match(/^(\S+)\s+(.+)$/);
      const price = m[1]==="-" ? null : +m[1], key = m[2].trim();
      const p = {id:"p"+P.length,cat:cid,fam,price,moods:[],tag:false,img:PHOTO[fam+"|"+key]?IMG[PHOTO[fam+"|"+key]]:""};
      if(fam==="المشروبات"){
        const d = DRINKS[key]; p.ar=d[0]; p.fr=d[1]; p.drink=d[2];
        p.layers=[d[2],d[2],d[2]]; p.top=d[2]; p.sp=[];
      } else {
        const fl = FL[key], base = BASE[fam];
        p.ar = f[0]+" "+fl[0]; p.fr = f[1]+" "+fl[1];
        p.layers = fl[2].length===0 ? [base,"cream",base] : fl[2].length===1 ? [base,"cream",fl[2][0]] : [base].concat(fl[2]).slice(0,4);
        p.top = fl[3]; p.sp = fl[4];
        if(price!==null && price<=250) p.moods.push("cheap");
        if(FRUITY.includes(key)) p.moods.push("fruit");
        if(key==="مكس" || fam==="كبسة" || fam==="هابي كيك") p.moods.push("friends");
        if(fam==="ام علي" || fam==="مدلعة") p.moods.push("tired");
        if(fam==="فتة" || fam==="كشري") p.moods.push("late");
        if((fam==="ملوخيتو" && key==="بستاشيو") || (fam==="كيك بوم" && key==="فواكه")) p.tag=true;
      }
      P.push(p);
    });
  }
})();

/* ================= CUP ILLUSTRATION ================= */
let uid = 0;
function rnd(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function cup(p, extraColors=[], still=false){
  const id="cc"+(uid++), cls = still?"still":"";
  const layers=p.layers, n=layers.length, yTop=p.drink?48:46, yBot=134, h=(yBot-yTop)/n;
  let L="";
  layers.forEach((k,i)=>{
    const y=yBot-h*(i+1);
    const wave = (i===n-1||p.drink) ? "" : `<path d="M10 ${y+2} q12 -5 24 0 t24 0 t24 0 t24 0 t24 0 V${y+6} H10z" fill="${C[layers[i+1]]}"/>`;
    L+=`<g class="fill ${cls}" style="animation-delay:${(i*.22).toFixed(2)}s"><rect x="10" y="${y.toFixed(1)}" width="100" height="${(h+1).toFixed(1)}" fill="${C[k]}"/>${wave}</g>`;
  });
  let crown="";
  if(p.drink){
    crown=`<path d="M70 52 L84 6 L94 8" stroke="#16348C" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  } else {
    const r=rnd(p.id.length*97+(p.price||333)+extraColors.length*7+p.ar.length*13), sp=p.sp.concat(extraColors);
    let dots="";
    for(let i=0;i<9+extraColors.length*5;i++){
      const a=r()*Math.PI, d=r(), x=60+Math.cos(a)*(36*d+4)*(r()>.5?1:-1), y=38-Math.sin(a)*12*d+r()*4, col=C[sp[i%sp.length]]||C.nuts;
      dots += r()>.45 ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(2+r()*2).toFixed(1)}" fill="${col}"/>`
        : `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="7" height="3" rx="1.5" fill="${col}" transform="rotate(${(r()*180).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    }
    crown=`<path d="M22 42 Q60 14 98 42 Q96 50 60 50 Q24 50 22 42Z" fill="${C[p.top]}" class="fill ${cls}" style="animation-delay:${(n*.22).toFixed(2)}s"/><g class="fill ${cls}" style="animation-delay:${(n*.22+.15).toFixed(2)}s">${dots}</g>`;
  }
  return `<svg viewBox="0 0 120 150" aria-hidden="true"><defs><clipPath id="${id}"><path d="M17 26H103L93 132Q92 140 84 140H36Q28 140 27 132Z"/></clipPath></defs>
  <ellipse cx="60" cy="144" rx="34" ry="4" fill="#16348C" opacity=".12"/>
  <g clip-path="url(#${id})"><rect x="10" y="20" width="100" height="125" fill="#EAF6FD"/>${L}</g>${crown}
  <path d="M17 26H103L93 132Q92 140 84 140H36Q28 140 27 132Z" fill="none" stroke="#16348C" stroke-opacity=".2" stroke-width="2"/>
  <path d="M26 34 L33 126" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
  <rect x="12" y="23" width="96" height="6" rx="3" fill="#16348C" opacity=".14"/></svg>`;
}

function tub(p, extraColors=[]){
  const [body,ink,label]=TUB[p.fam], id="tb"+(uid++), r=rnd(p.id.length*53+(p.price||321)+extraColors.length*11+p.ar.length*7);
  let sky="";
  for(let x=14;x<108;){
    const k=r();
    if(k<.35){const h=10+r()*9;sky+=`<rect x="${x}" y="${96-h}" width="2.4" height="${h}"/><circle cx="${x+1.2}" cy="${96-h}" r="1.6"/>`;x+=4+r()*4}
    else if(k<.7){const rr=4+r()*4;sky+=`<path d="M${x} 96 a${rr} ${rr*1.1} 0 0 1 ${rr*2} 0z"/><rect x="${x+rr-0.6}" y="${96-rr*1.1-4}" width="1.2" height="4"/>`;x+=rr*2+2}
    else {const h=4+r()*5;sky+=`<path d="M${x} 96 L${x+5} ${96-h} L${x+10} 96z"/>`;x+=11}
  }
  const sp=p.sp.concat(extraColors); let dots="";
  for(let i=0;i<14+extraColors.length*6;i++){
    const a=r()*Math.PI*2, d=Math.sqrt(r()), x=60+Math.cos(a)*40*d, y=36+Math.sin(a)*7*d, col=C[sp[i%sp.length]]||C.nuts;
    dots+=r()>.5?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.6+r()*1.8).toFixed(1)}" fill="${col}"/>`:`<rect x="${x.toFixed(1)}" y="${(y-1).toFixed(1)}" width="5" height="2.4" rx="1.2" fill="${col}" transform="rotate(${(r()*180)|0} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
  }
  const txt = label.includes("|")
    ? `<text x="60" y="60" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-weight="700" font-size="13" fill="#14306E" letter-spacing=".5">${label.split("|")[0]}</text><text x="60" y="73" text-anchor="middle" font-family="IBM Plex Sans,sans-serif" font-weight="700" font-size="13" fill="#14306E" letter-spacing=".5">${label.split("|")[1]}</text>`
    : `<text x="60" y="68" text-anchor="middle" font-family="IBM Plex Sans Arabic,sans-serif" font-weight="600" font-size="15" fill="#14306E">${label}</text>`;
  return `<svg viewBox="0 0 120 112" aria-hidden="true"><defs><clipPath id="${id}"><path d="M10 36 L20 100 Q21 104 26 104 L94 104 Q99 104 100 100 L110 36Z"/></clipPath></defs>
  <ellipse cx="60" cy="106" rx="42" ry="4" fill="#16348C" opacity=".14"/>
  <path d="M10 36 L20 100 Q21 104 26 104 L94 104 Q99 104 100 100 L110 36Z" fill="#FFFFFF" stroke="#14306E" stroke-opacity=".22" stroke-width="1.2"/>
  <g clip-path="url(#${id})" fill="#14306E" opacity=".88"><rect x="0" y="95.5" width="120" height="10"/>${sky}</g>
  <path d="M10 36 L20 100 Q21 104 26 104 L32 104 L18 36Z" fill="#000" opacity=".06"/>
  
  ${txt}
  <ellipse cx="60" cy="36" rx="51" ry="11.5" fill="#FFFFFF" stroke="#14306E" stroke-opacity=".22" stroke-width="1.2"/>
  <ellipse cx="60" cy="36.5" rx="46" ry="8.6" fill="${C[p.top]}"/>
  <ellipse cx="60" cy="38.5" rx="46" ry="6.2" fill="#000" opacity=".06"/>
  ${dots}
  </svg>`;
}
/* picture for any product: real photo > packaging tub > cup */
function art(p, extraColors=[], still=false){
  if(p.img) return `<img src="${p.img}" alt="" loading="lazy">`;
  if(TUB[p.fam]) return tub(p, extraColors);
  return cup(p, extraColors, still);
}

/* ================= STATE ================= */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S = {
  lang: store.get("ke_lang","ar"), branch: store.get("ke_branch","mosta"),
  cart: store.get("ke_cart2",[]).filter(l=>P.some(p=>p.id===l.pid)),
  mood:"all", budget:1000, mode: store.get("ke_mode","delivery"),
  who: store.get("ke_who",{name:"",phone:"",addr:""}), tried:false
};
const save=()=>{store.set("ke_cart2",S.cart);store.set("ke_branch",S.branch);store.set("ke_mode",S.mode);store.set("ke_who",S.who);store.set("ke_lang",S.lang)};
const t=k=>T[S.lang][k];
const L=o=>o[S.lang];
const fmt=n=>n.toLocaleString("fr-FR").replace(/ | /g," ")+" "+t("cur");
const findP=id=>P.find(x=>x.id===id), findX=id=>EXTRAS.find(x=>x.id===id), curB=()=>BRANCHES.find(x=>x.id===S.branch);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= HOURS ================= */
function status(){
  const parts=new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Algiers",weekday:"short",hour:"2-digit",hour12:false}).formatToParts(new Date());
  const day=(parts.find(x=>x.type==="weekday")||{}).value, h=+((parts.find(x=>x.type==="hour")||{}).value)%24;
  const opens=day==="Fri"?14:11, open=h>=opens||h<1;
  return {open, txt: open?t("open"):t("closed")(opens)};
}

/* ================= RENDER ================= */
function applyLang(){
  const ar=S.lang==="ar";
  document.documentElement.lang=S.lang; document.body.dir=ar?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=t(el.dataset.i)});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===S.lang));
  document.querySelectorAll(".cur").forEach(el=>el.textContent=t("cur"));
  $("#brandName").textContent = ar?"قشطوطة السعادة":"Kachtoutat Essaâda";
  $("#sNote").placeholder=t("notePh");
  [["ig","Ig"],["fb","Fb"],["tt","Tt"]].forEach(([k,id])=>{$("#s"+id).href=SOCIAL[k].url;$("#f"+id).href=SOCIAL[k].url;$("#s"+id+"H").textContent=SOCIAL[k].handle});
  $("#footBr").textContent = BRANCHES.map(b=>L(b)).join(" · ");
  $("#budget").setAttribute("aria-label",t("budget"));
  $("#moods").innerHTML = MOODS.map(m=>`<button class="chip" type="button" data-m="${m.id}" aria-pressed="${m.id===S.mood}">${L(m)}</button>`).join("");
  $("#tabs").innerHTML = CATS.map((c,i)=>`<button class="tab" type="button" data-t="${c.id}" aria-pressed="${i===0}">${L(c)}</button>`).join("");
  renderBranches(); renderMenu(); renderCart();
  if(cur) paintSheet(true);
}
function renderBranches(){
  const st=status(), fri=(new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Algiers",weekday:"short"}).format(new Date()))==="Fri";
  const fmtPh=n=>n.replace(/^(\d{4})(\d{2})(\d{2})(\d{2})$/,"$1 $2 $3 $4");
  $("#branches").innerHTML = BRANCHES.map(b=>`<div class="bcard" data-on="${b.id===S.branch}">
    <span class="btop"><span><span class="bname">${L(b)}</span><span class="bsub">${S.lang==="ar"?b.fr:b.ar}${b.nAr?" · "+(S.lang==="ar"?b.nAr:b.nFr):""}</span></span>
      <span class="stat ${st.open?"":"off"}"><span class="dot"></span>${st.txt}</span></span>
    <dl class="binfo">
      <div><dt>${t("phoneL")}</dt><dd class="ph num">${b.phones.map(fmtPh).map(x=>`<span>${x}</span>`).join("")}</dd></div>
      <div><dt>${t("hoursL")}</dt><dd class="num" dir="ltr">${fri?"14:00":"11:00"} – 01:00</dd></div>
    </dl>
    <div class="bact"><a class="bmap" href="${b.map}" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>${t("mapL")}</a>
    <button class="bsel" type="button" data-b="${b.id}" aria-pressed="${b.id===S.branch}">${b.id===S.branch?t("selected"):t("choose")}</button></div></div>`).join("");
  $("#htxt").textContent = t("pill")(L(curB()),st.open);
  $("#hdot").className = "dot"+(st.open?"":" off");
}
function match(p){return (p.price===null?S.budget>=1000:p.price<=S.budget) && (S.mood==="all"||p.moods.includes(S.mood))}
function renderMenu(){
  $("#budgetVal").textContent=S.budget;
  const n=P.filter(match).length;
  $("#budgetHint").textContent = n ? t("fit")(n) : t("nofit");
  let html="";
  CATS.forEach(c=>{
    const items=P.filter(p=>p.cat===c.id&&match(p)); if(!items.length) return;
    html+=`<div class="cat" id="cat-${c.id}"><h3>${c.cov?`<img class="cov" src="${c.cov}" alt="">`:""}${L(c)} <span class="n num">${items.length}</span></h3><p>${S.lang==="ar"?c.sAr:c.sFr}</p><div class="grid">`+
    items.map(p=>`<article class="card">${p.tag?`<span class="tag">${t("star")}</span>`:""}
      <button class="pic${!p.img&&TUB[p.fam]?" tub":""}" type="button" data-open="${p.id}" aria-label="${esc(L(p))}">${art(p)}${p.img?`<span class="real">${t("realPh")}</span>`:""}</button>
      <h4 class="nm">${L(p)}${S.lang==="fr"?`<span class="ar" lang="ar" dir="rtl">${p.ar}</span>`:""}</h4>
      <div class="row"><span class="pr num">${p.price===null?`<small>${t("ask")}</small>`:`${p.price} <small>${t("cur")}</small>`}</span>
      <button class="add" type="button" data-quick="${p.id}" aria-label="${t("add")}: ${esc(L(p))}">+</button></div></article>`).join("")+`</div></div>`;
  });
  $("#cats").innerHTML = html || `<div class="empty">${t("noneMenu")}</div>`;
  observeCats();
}

/* events: header + finder + menu */
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b||b.dataset.lang===S.lang)return;S.lang=b.dataset.lang;save();applyLang()});
$("#branches").addEventListener("click",e=>{const c=e.target.closest("[data-b]");if(!c)return;S.branch=c.dataset.b;save();renderBranches();renderCart()});
$("#moods").addEventListener("click",e=>{const c=e.target.closest("[data-m]");if(!c)return;S.mood=c.dataset.m;
  document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",x===c));renderMenu();$("#menu").scrollIntoView({behavior:"smooth"})});
$("#budget").addEventListener("input",e=>{S.budget=+e.target.value;renderMenu()});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-t]");if(!b)return;const el=document.getElementById("cat-"+b.dataset.t);
  if(!el)return;const off=document.querySelector("header").offsetHeight+$("#tabs").offsetHeight+8;window.scrollTo({top:el.getBoundingClientRect().top+scrollY-off,behavior:"smooth"})});
$("#cats").addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o) return openSheet(o.dataset.open);
  const q=e.target.closest("[data-quick]"); if(q){addToCart(q.dataset.quick,[],1,"");fly(q.closest(".card").querySelector(".pic img, .pic svg"))}
});
let io=null;
function observeCats(){
  if(!("IntersectionObserver" in window))return;
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(en=>{if(!en.isIntersecting)return;const id=en.target.id.replace("cat-","");
    document.querySelectorAll("[data-t]").forEach(tb=>{const on=tb.dataset.t===id;tb.setAttribute("aria-pressed",on);if(on)tb.scrollIntoView({block:"nearest",inline:"center"})})}),{rootMargin:"-40% 0px -55% 0px"});
  document.querySelectorAll(".cat").forEach(c=>io.observe(c));
}

/* ================= SHEET ================= */
let cur=null;
function openSheet(pid){
  const p=findP(pid); cur={p,extras:[],qty:1}; $("#sNote").value="";
  document.querySelectorAll(".xonly").forEach(x=>x.hidden=!!p.drink);
  paintSheet(false); show("#sheet");
}
function sheetTotal(){return((cur.p.price||0)+cur.extras.reduce((s,id)=>s+findX(id).price,0))*cur.qty}
function paintSheet(keep){
  const p=cur.p;
  $("#sName").textContent=L(p);
  $("#sBase").textContent=L(CATS.find(c=>c.id===p.cat));
  $("#sExtras").innerHTML=EXTRAS.map(x=>`<button class="chip extra" type="button" data-x="${x.id}" aria-pressed="${cur.extras.includes(x.id)}"><i style="background:${C[x.color]}"></i>${L(x)} <span class="num">+${x.price}</span></button>`).join("");
  $("#sCup").innerHTML=art(p,cur.extras.map(id=>findX(id).color),keep);
  $("#sPrice").textContent=p.price===null?t("ask"):fmt(p.price);
  $("#sQty").textContent=cur.qty;
  $("#sAdd").textContent=p.price===null?t("add"):`${t("add")} · ${fmt(sheetTotal())}`;
}
$("#sExtras").addEventListener("click",e=>{const b=e.target.closest("[data-x]");if(!b)return;const id=b.dataset.x;
  cur.extras=cur.extras.includes(id)?cur.extras.filter(x=>x!==id):cur.extras.concat(id);paintSheet(true)});
$("#sMinus").onclick=()=>{cur.qty=Math.max(1,cur.qty-1);paintSheet(true)};
$("#sPlus").onclick=()=>{cur.qty=Math.min(20,cur.qty+1);paintSheet(true)};
$("#sAdd").onclick=()=>{const svg=$("#sCup img, #sCup svg");addToCart(cur.p.id,cur.extras,cur.qty,$("#sNote").value.trim());fly(svg);hide()};

/* ================= CART ================= */
const unit=l=>(findP(l.pid).price||0)+l.extras.reduce((s,id)=>s+findX(id).price,0);
const total=()=>S.cart.reduce((s,l)=>s+unit(l)*l.qty,0);
const count=()=>S.cart.reduce((s,l)=>s+l.qty,0);
const hasUnknown=()=>S.cart.some(l=>findP(l.pid).price===null);
function addToCart(pid,extras,qty,note){
  const k=pid+"|"+extras.slice().sort().join(",")+"|"+note, ex=S.cart.find(l=>l.k===k);
  if(ex)ex.qty=Math.min(50,ex.qty+qty);else S.cart.push({k,pid,extras:extras.slice(),qty,note});
  save();renderCart();const b=$("#cartBtn");b.classList.remove("bump");void b.offsetWidth;b.classList.add("bump");
}
function orderText(){
  const M=t("msg"), b=curB(), ref="KE-"+(1000+(Date.now()/1000|0)%9000), fr=S.lang==="fr", del=S.mode==="delivery", w=S.who;
  const items=S.cart.map(l=>{
    const p=findP(l.pid), nm=fr?`${p.fr} (${p.ar})`:p.ar;
    const ex=l.extras.length?` + ${l.extras.map(id=>fr?findX(id).fr:findX(id).ar).join(fr?", ":"، ")}`:"";
    return `• ${l.qty}× ${nm}${ex} — ${p.price===null?t("askLine"):fmt(unit(l)*l.qty)}${l.note?`\n   ↳ ${l.note}`:""}`;
  }).join("\n");
  return `${M.h}\n${M.br}: ${L(b)} · ${ref}\n━━━━━━━━━━\n${items}\n━━━━━━━━━━\n${M.tot}: ${fmt(total())}${del?" "+M.ex:""}${hasUnknown()?" "+M.unk:""}\n${M.type}: ${del?M.d:M.p}\n${M.n}: ${w.name}\n${M.t}: ${w.phone}${del?`\n${M.a}: ${w.addr}`:""}`;
}
function validate(){
  if(!S.cart.length)return t("eEmpty");
  if(!S.who.name.trim())return t("eName");
  if(!/^0[5-7]\d{8}$/.test(S.who.phone.replace(/[\s.-]/g,"")))return t("ePhone");
  if(S.mode==="delivery"&&S.who.addr.trim().length<4)return t("eAddr");
  return "";
}
function updateWa(){
  const err=validate(), a=$("#waBtn");
  $("#dErr").textContent=S.tried?err:"";
  if(err){a.setAttribute("aria-disabled","true");a.href="#"}
  else{a.setAttribute("aria-disabled","false");a.href=`https://wa.me/213${curB().phones[0].slice(1)}?text=${encodeURIComponent(orderText())}`}
  $("#waNum").innerHTML=`${t("waNum")(L(curB()))} <span class="num" dir="ltr">${curB().phones[0]}</span>`;
}
function renderCart(){
  const n=count();
  $("#cartCount").textContent=n;
  $("#mbar").classList.toggle("on",n>0);document.body.classList.toggle("hasbar",n>0);
  $("#mbarCount").textContent=t("inCart")(n);
  $("#mbarTotal").textContent=fmt(total());
  $("#dTotal").textContent=fmt(total())+(hasUnknown()?" +":"");
  if(!S.cart.length){$("#dBody").innerHTML=`<div class="empty">${t("empty")}</div>`;$("#dFoot").hidden=true;return}
  $("#dFoot").hidden=false;
  const del=S.mode==="delivery";
  $("#dBody").innerHTML=S.cart.map((l,i)=>{const p=findP(l.pid),ex=l.extras.map(findX);
    return `<div class="line"><div class="mini">${art(p,ex.map(x=>x.color),true)}</div>
    <div class="t"><b>${L(p)}</b><small>${ex.length?"+ "+ex.map(x=>L(x)).join(S.lang==="ar"?"، ":", "):t("noExtra")}${l.note?" · "+esc(l.note):""}</small>
    <div class="num" style="color:var(--navy)">${p.price===null?t("askLine"):fmt(unit(l)*l.qty)}</div></div>
    <div class="qty"><button type="button" data-dec="${i}" aria-label="−">−</button><output class="num">${l.qty}</output><button type="button" data-inc="${i}" aria-label="+">+</button></div></div>`}).join("")+`
    <div class="field"><label for="fBranch">${t("branch")}</label><select id="fBranch">${BRANCHES.map(x=>`<option value="${x.id}" ${x.id===S.branch?"selected":""}>${L(x)}</option>`).join("")}</select></div>
    <div class="seg" role="group"><button type="button" data-mode="delivery" aria-pressed="${del}">${t("deliv")}</button><button type="button" data-mode="pickup" aria-pressed="${!del}">${t("pick")}</button></div>
    <div class="field"><label for="fName">${t("name")}</label><input type="text" id="fName" autocomplete="name" value="${esc(S.who.name)}" placeholder="${t("namePh")}"></div>
    <div class="field"><label for="fPhone">${t("phone")}</label><input type="tel" id="fPhone" dir="ltr" inputmode="tel" autocomplete="tel" value="${esc(S.who.phone)}" placeholder="05 50 12 34 56"></div>
    <div class="field" ${del?"":"hidden"}><label for="fAddr">${t("addr")(L(curB()))}</label><textarea id="fAddr" placeholder="${t("addrPh")}">${esc(S.who.addr)}</textarea></div>`;
  updateWa();
}
$("#dBody").addEventListener("click",e=>{
  const d=e.target.closest("[data-dec]"),u=e.target.closest("[data-inc]"),m=e.target.closest("[data-mode]");
  if(d){const i=+d.dataset.dec;if(--S.cart[i].qty<=0)S.cart.splice(i,1);save();renderCart()}
  if(u){const i=+u.dataset.inc;S.cart[i].qty=Math.min(50,S.cart[i].qty+1);save();renderCart()}
  if(m){S.mode=m.dataset.mode;save();renderCart()}
});
$("#dBody").addEventListener("input",e=>{const x=e.target;
  if(x.id==="fName")S.who.name=x.value;if(x.id==="fPhone")S.who.phone=x.value;if(x.id==="fAddr")S.who.addr=x.value;save();updateWa()});
$("#dBody").addEventListener("change",e=>{if(e.target.id==="fBranch"){S.branch=e.target.value;save();renderBranches();renderCart()}});
$("#waBtn").addEventListener("click",e=>{if($("#waBtn").getAttribute("aria-disabled")==="true"){e.preventDefault();S.tried=true;updateWa()}});
$("#copyBtn").addEventListener("click",async()=>{
  const txt=orderText(), done=()=>{$("#copyBtn").textContent=t("copied");setTimeout(()=>$("#copyBtn").textContent=t("copy"),1800)};
  try{await navigator.clipboard.writeText(txt);done()}catch(err){const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(_){}ta.remove();done()}
});

/* ================= OVERLAYS ================= */
let opened=null;
function show(sel){opened=$(sel);opened.classList.add("on");$("#scrim").classList.add("on")}
function hide(){if(opened)opened.classList.remove("on");opened=null;$("#scrim").classList.remove("on")}
$("#scrim").onclick=hide;$("#dClose").onclick=hide;
$("#cartBtn").onclick=()=>{renderCart();show("#drawer")};
$("#mbarBtn").onclick=()=>{renderCart();show("#drawer")};
document.addEventListener("keydown",e=>{if(e.key==="Escape")hide()});

function fly(svg){
  if(!svg||matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const from=svg.getBoundingClientRect(), tgt=(getComputedStyle($("#mbar")).display!=="none"?$("#mbarBtn"):$("#cartBtn")).getBoundingClientRect();
  const f=document.createElement("div");f.className="flyer";f.innerHTML=svg.outerHTML;const im=f.querySelector("img");if(im)im.style.cssText="position:static;width:60px;height:60px;object-fit:cover;display:block";
  f.style.left=from.left+from.width/2-30+"px";f.style.top=from.top+from.height/2-35+"px";document.body.appendChild(f);
  requestAnimationFrame(()=>{f.style.transform=`translate(${tgt.left+tgt.width/2-(from.left+from.width/2)}px,${tgt.top+tgt.height/2-(from.top+from.height/2)}px) scale(.25) rotate(-25deg)`;f.style.opacity=".4"});
  setTimeout(()=>f.remove(),750);
}

applyLang();
setInterval(renderBranches,60000);
})();
</script>
